<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
</head>
<body>
    <h2>Change Password</h2>

    <form id="changePasswordForm">
        <label>Old Password:</label><br>
        <input type="password" id="oldPassword" required><br><br>

        <label>New Password:</label><br>
        <input type="password" id="newPassword" required><br><br>

        <label>Confirm New Password:</label><br>
        <input type="password" id="confirmPassword" required><br><br>

        <button type="submit">Submit</button>
    </form>

    <p id="message" style="color: red;"></p>

    <script>
        const token = localStorage.getItem("jwt_token");
        if (!token) {
            alert("Not logged in. Please log in first.");
            window.location.href = "/login.html";
        }

        document.getElementById("changePasswordForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const oldPassword = document.getElementById("oldPassword").value;
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (newPassword !== confirmPassword) {
                document.getElementById("message").innerText = "The new passwords do not match.";
                return;
            }

            try {
                const res = await fetch("/api/change-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        oldPassword,
                        newPassword
                    })
                });

                const text = await res.text();
                let data = {};
                try {
                    data = JSON.parse(text);
                } catch {
                    document.getElementById("message").innerText = "Invalid response from server: " + text;
                    return;
                }

                if (res.ok) {
                    alert("Password changed successfully. Please log in again.");
                    localStorage.removeItem("jwt_token");
                    window.location.href = "/login.html";
                } else {
                    document.getElementById("message").innerText = data.message || "Failed to change password.";
                }

            } catch (err) {
                document.getElementById("message").innerText = "Request failed. Please try again later.";
            }
        });
    </script>
</body>
</html>
