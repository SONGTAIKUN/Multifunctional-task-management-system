<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
</head>
<body>
    <h2>Please sign in</h2>
    <form id="loginForm">
        <label>Username:</label><br>
        <input type="text" name="username" id="username" required><br><br>

        <label>Password:</label><br>
        <input type="password" name="password" id="password" required><br><br>

        <button type="submit">Sign in</button>
    </form>

    <p id="message" style="color: red;"></p>

    <p>
        <button type="button" onclick="window.location.href='/register.html'">Register</button>
    </p>

    <script>
        const existingToken = localStorage.getItem("jwt_token");
        if (existingToken) {
            try {
                const decoded = jwt_decode(existingToken);
                const now = Date.now();
                const exp = decoded.exp * 1000;
                if (exp > now) {
                    window.location.href = "/userinfo.html";
                } else {
                    localStorage.removeItem("jwt_token");
                }
            } catch (e) {
                localStorage.removeItem("jwt_token");
            }
        }

        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                const res = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({ username, password })
                });

                const text = await res.text();
                let data = {};
                try {
                    data = JSON.parse(text);
                } catch {
                    document.getElementById("message").innerText = "Invalid JSON response from server: " + text;
                    return;
                }

                if (res.ok && data.token) {
                    localStorage.setItem("jwt_token", data.token);
                    localStorage.setItem("role", data.role);
                    window.location.href = "/userinfo.html";
                } else {
                    document.getElementById("message").innerText = data.message || "Login failed.";
                }
            } catch (err) {
                document.getElementById("message").innerText = "Network error. Login failed.";
            }
        });
    </script>
</body>
</html>
